<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Particle Flow</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: white;
    }
    canvas {
      display: block;
    }
  </style>
  <!-- p5.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<script>
/*--------------------
Vars
--------------------*/
const deg = (a) => Math.PI / 180 * a
const rand = (v1, v2) => Math.floor(v1 + Math.random() * (v2 - v1))
const opt = {
  particles: 300,
  noiseScale: 0.003,
  // Angle pointing mostly downward
  angle: Math.PI / 180,
  // Blue / aqua palette
  h1: 185, // aqua-ish
  h2: 225, // blue-ish
  s1: 80,
  s2: 90,
  l1: 45,
  l2: 55,
  speed: 0.5,
  strokeWeight: 5,
  tail: 0.98,
}
const Particles = []
let time = 0

/*--------------------
Particle
--------------------*/
class Particle {
  constructor(x, y) {
    this.x = x
    this.y = y
    this.lx = x
    this.ly = y
    this.vx = 0
    this.vy = 0
    this.ax = 0
    this.ay = 0
    this.speed = opt.speed
    this.hueRand = Math.random()
    this.hue = this.hueRand > .5 ? 20 + opt.h1 : 20 + opt.h2
    this.sat = this.hueRand > .5 ? opt.s1 : opt.s2
    this.light = this.hueRand > .5 ? opt.l1 : opt.l2
    this.maxSpeed = this.hueRand > .5 ? 3 : 2
  }

  respawn() {
    // Enter from just outside left or top edge, since flow is right-and-down
    if (Math.random() < 0.5) {
      this.x = rand(-20, -5)
      this.y = Math.random() * height
    } else {
      this.x = Math.random() * width
      this.y = rand(-20, -5)
    }
    this.vx = 0
    this.vy = 0
    this.updatePrev()
  }

  update() {
    this.follow()

    this.vx += this.ax
    this.vy += this.ay

    let p = Math.sqrt(this.vx * this.vx + this.vy * this.vy)
    let a = Math.atan2(this.vy, this.vx)
    let m = Math.min(this.maxSpeed, p) * this.speed
    this.vx = Math.cos(a) * m
    this.vy = Math.sin(a) * m

    this.x += this.vx
    this.y += this.vy
    this.ax = 0
    this.ay = 0

    this.edges()
  }

  follow() {
    let angle =
      noise(this.x * opt.noiseScale, this.y * opt.noiseScale, time * opt.noiseScale) *
        Math.PI *
        0.5 +
      opt.angle
    this.ax += Math.cos(angle)
    this.ay += Math.sin(angle)
  }

  updatePrev() {
    this.lx = this.x
    this.ly = this.y
  }

  edges() {
    // Respawn from entry edges instead of wrapping, so paths aren't continuously repainted
    if (this.x > width + 20 || this.y > height + 20 || this.x < -30 || this.y < -30) {
      this.respawn()
    }
  }

  render() {
    stroke(`hsla(${this.hue}, ${this.sat}%, ${this.light}%, 1)`)
    line(this.x, this.y, this.lx, this.ly)
    this.updatePrev()
  }
}

/*--------------------
Setup
--------------------*/
function setup() {
  // Transparent canvas so the body gradient shows through
  createCanvas(530, windowHeight)
  background(230, 230, 244)
  for (let i = 0; i < opt.particles; i++) {
    Particles.push(new Particle(Math.random() * width, Math.random() * height))
  }
  strokeWeight(opt.strokeWeight)
}

/*--------------------
Draw
--------------------*/
function draw() {
  time++
  // Fade toward white using drawingContext directly; bypasses p5.js color mode
  // so the fixed point is guaranteed to be pure white.
  drawingContext.save()
  drawingContext.fillStyle = `rgba(230, 230, 244, ${1 - opt.tail})`
  drawingContext.fillRect(0, 0, width, height)
  drawingContext.restore()
  for (let p of Particles) {
    p.update()
    p.render()
  }
}

</script>
</body>
</html>
